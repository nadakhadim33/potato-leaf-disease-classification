<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Potato Disease AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom styling for the upload card, buttons, and result box (Bootstrap handles the rest) -->
    <style>
        body {
            background: linear-gradient(135deg, #dff6d8, #ffffff);
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }

        .title {
            color: #2e7d32;
            font-weight: 700;
            margin-top: 40px;
        }

        .card-box {
            background: white;
            border-radius: 25px;
            padding: 35px;
            width: 90%;
            max-width: 750px;
            margin: 40px auto;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.15);
        }

        .upload-box {
            border: 2px dashed #4caf50;
            border-radius: 15px;
            padding: 25px;
            background: #f8fff8;
        }

        .btn-predict {
            background: #2e7d32;
            border: none;
            padding: 12px 35px;
            font-size: 18px;
            border-radius: 30px;
        }

        .btn-predict:hover {
            background: #1b5e20;
        }

        .result-box {
            margin-top: 25px;
            background: #f1f8e9;
            border-left: 6px solid #4caf50;
            padding: 20px;
            border-radius: 15px;
        }

        .result-title {
            color: #2e7d32;
            font-weight: bold;
        }

        img {
            max-height: 350px;
            object-fit: contain;
            border-radius: 20px;
            margin-top: 20px;
        }

    </style>
</head>


<body>

<!-- Page header / title -->
<h1 class="text-center title">
    🌱 Potato Disease Classification AI
</h1>

<p class="text-center text-muted">
    Upload a potato leaf image and let AI detect possible diseases
</p>


<div class="card-box">

    <h2 class="text-center mb-4">
        🍃 Upload Leaf Image
    </h2>


    <!-- Image upload form: sends the file to the Flask "/" route as multipart/form-data -->
    <form action="/" method="post" enctype="multipart/form-data">

        <div class="upload-box text-center">

            <label class="form-label fw-bold">
                Select potato leaf image
            </label>

            <input
                type="file"
                name="file"
                accept=".jpg,.jpeg,.png"
                class="form-control mt-2"
                required
            >

            <button class="btn btn-success btn-predict mt-4">
                🔍 Predict Disease
            </button>

        </div>


        <!-- Shown when there's no file, an invalid file type, or a general status message -->
        {% if message %}
        <div class="alert alert-danger mt-4">
            {{ message }}
        </div>
        {% endif %}



        <!-- Shown after a successful prediction: the uploaded image + predicted class + confidence -->
        {% if image_path %}

        <div class="text-center">

            <img src="{{ image_path }}"
                 class="img-fluid shadow">

        </div>


        <div class="result-box">

            <h4 class="result-title">
                AI Result
            </h4>

            <p>
                🥔 Prediction:
                <b>{{ predicted_label }}</b>
            </p>

            <p>
                📊 Confidence:
                <b>{{ confidence }}%</b>
            </p>

        </div>

        {% endif %}


    </form>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
